<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0f1115" />
  <title>Remotify ChatGPT</title>
  <style>
    :root{color-scheme:dark;--bg:#0f1115;--panel:#171a21;--panel2:#1f232d;--line:#2b313d;--text:#f4f5f7;--muted:#9da6b4;--accent:#f28c28;--danger:#ff6677}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;height:100dvh;overflow:hidden}
    button,textarea,input{font:inherit}.app{height:100dvh;display:grid;grid-template-columns:280px minmax(0,1fr)}
    .sidebar{background:#12151b;border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}.brand{padding:18px 16px 12px;font-weight:700}.new{margin:0 12px 10px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--text);cursor:pointer}.conversations{overflow:auto;padding:0 8px 14px}.conv{width:100%;text-align:left;border:0;background:transparent;color:var(--text);padding:10px;border-radius:10px;cursor:pointer}.conv:hover,.conv.active{background:var(--panel2)}.conv-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}.conv-time{font-size:11px;color:var(--muted);margin-top:3px}
    .main{min-width:0;display:flex;flex-direction:column}.topbar{height:52px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 14px;gap:10px}.menu{display:none;border:0;background:transparent;color:var(--text);font-size:22px}.status{font-size:12px;color:var(--muted);margin-left:auto}.messages{flex:1;overflow:auto;padding:20px max(16px,calc((100% - 820px)/2)) 150px}.message{max-width:820px;margin:0 auto 18px}.role{font-size:12px;color:var(--muted);margin-bottom:6px}.bubble{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.58}.user .bubble{background:var(--panel2);padding:12px 14px;border-radius:14px}.assistant .bubble{padding:4px 0}.empty{max-width:820px;margin:18vh auto 0;color:var(--muted);text-align:center}.empty h1{color:var(--text);font-size:26px;margin:0 0 8px}
    .composer-wrap{position:absolute;left:280px;right:0;bottom:0;padding:14px max(14px,calc((100% - 850px)/2)) max(14px,env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 28%)}.composer{display:flex;align-items:flex-end;gap:9px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:9px}.composer textarea{flex:1;resize:none;max-height:180px;min-height:42px;border:0;outline:0;background:transparent;color:var(--text);padding:10px 4px}.iconbtn,.send{border:0;border-radius:12px;height:42px;min-width:42px;cursor:pointer}.iconbtn{background:var(--panel2);color:var(--text);font-size:18px}.iconbtn.recording{background:var(--danger)}.send{background:var(--accent);color:#111;font-weight:700;padding:0 16px}.send:disabled,.iconbtn:disabled{opacity:.45;cursor:not-allowed}.hint{font-size:11px;color:var(--muted);padding:5px 5px 0}
    .overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}.card{width:min(420px,100%);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px}.card h2{margin:0 0 8px}.card p{color:var(--muted);line-height:1.5}.card input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:#11151b;color:var(--text)}.card button{width:100%;margin-top:10px;padding:12px;border:0;border-radius:10px;background:var(--accent);font-weight:700}.error{color:#ff8996;font-size:13px;margin-top:8px}.hidden{display:none!important}
    @media(max-width:760px){.app{grid-template-columns:1fr}.sidebar{position:fixed;z-index:30;inset:0 auto 0 0;width:min(82vw,320px);transform:translateX(-101%);transition:.2s}.sidebar.open{transform:none}.menu{display:block}.composer-wrap{left:0}.messages{padding-left:14px;padding-right:14px}.topbar{padding-top:env(safe-area-inset-top);height:calc(52px + env(safe-area-inset-top))}}
  </style>
</head>
<body>
  <div class="app">
    <aside id="sidebar" class="sidebar">
      <div class="brand">Remotify ChatGPT</div>
      <button class="new" id="newChat">＋ 新对话</button>
      <div id="conversationList" class="conversations"></div>
    </aside>
    <main class="main">
      <header class="topbar"><button id="menuBtn" class="menu">☰</button><strong id="title">ChatGPT</strong><span id="status" class="status"></span></header>
      <section id="messages" class="messages"></section>
      <div class="composer-wrap">
        <div class="composer">
          <button id="micBtn" class="iconbtn" title="语音输入">🎙</button>
          <textarea id="input" rows="1" placeholder="输入内容，或点麦克风说话"></textarea>
          <button id="sendBtn" class="send">发送</button>
        </div>
        <div id="micHint" class="hint"></div>
      </div>
    </main>
  </div>

  <div id="authOverlay" class="overlay hidden">
    <div class="card">
      <h2>连接 Remotify</h2>
      <p>输入电脑端 .env 里的 REMOTIFY_TOKEN。只会保存在这台手机的浏览器里。</p>
      <input id="tokenInput" type="password" autocomplete="off" placeholder="REMOTIFY_TOKEN" />
      <button id="tokenBtn">连接</button>
      <div id="tokenError" class="error"></div>
    </div>
  </div>

<script>
let token = localStorage.getItem('remotify_token') || new URLSearchParams(location.search).get('token') || '';
let activeConversationId = null;
let sending = false;
let recorder = null;
let chunks = [];
let micStream = null;

if (new URLSearchParams(location.search).has('token')) {
  localStorage.setItem('remotify_token', token);
  history.replaceState({}, '', location.pathname);
}

const $ = id => document.getElementById(id);
const messagesEl = $('messages');
const inputEl = $('input');

function headers(extra={}) { return {'X-Remotify-Token': token, ...extra}; }
function setStatus(t){ $('status').textContent=t || ''; }
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function formatTime(iso){try{return new Date(iso).toLocaleString([], {month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});}catch{return '';}}

async function api(url, options={}){
  options.headers = headers(options.headers || {});
  const r = await fetch(url, options);
  if (r.status === 401) { showAuth('令牌不正确或已失效'); throw new Error('Unauthorized'); }
  if (!r.ok) { let msg=r.statusText; try{msg=(await r.json()).detail||msg}catch{} throw new Error(msg); }
  return r;
}

function showAuth(message=''){
  $('authOverlay').classList.remove('hidden');
  $('tokenError').textContent=message;
  $('tokenInput').value=token || '';
}
function hideAuth(){ $('authOverlay').classList.add('hidden'); }

async function checkHealth(){
  if(!token){showAuth();return false;}
  try{
    const r=await api('/api/health'); const j=await r.json();
    if(!j.api_key_configured) setStatus('需要配置 OPENAI_API_KEY'); else setStatus(j.model);
    hideAuth(); return true;
  }catch(e){ if(e.message!=='Unauthorized') showAuth(e.message); return false; }
}

async function loadConversations(selectFirst=false){
  const r=await api('/api/conversations'); const j=await r.json();
  const list=$('conversationList'); list.innerHTML='';
  j.conversations.forEach(c=>{
    const b=document.createElement('button'); b.className='conv'+(c.id===activeConversationId?' active':'');
    b.innerHTML=`<div class="conv-title">${esc(c.title)}</div><div class="conv-time">${esc(formatTime(c.updated_at))}</div>`;
    b.onclick=()=>openConversation(c.id); list.appendChild(b);
  });
  if(selectFirst && !activeConversationId && j.conversations.length) await openConversation(j.conversations[0].id);
  if(!j.conversations.length) renderEmpty();
}

function renderEmpty(){
  $('title').textContent='ChatGPT';
  messagesEl.innerHTML='<div class="empty"><h1>Remotify</h1><div>从手机直接和你的 API 对话。支持文字、历史记录和语音输入。</div></div>';
}

function appendMessage(role, text, id=null){
  const wrap=document.createElement('div'); wrap.className=`message ${role}`; if(id) wrap.id=id;
  wrap.innerHTML=`<div class="role">${role==='user'?'你':'ChatGPT'}</div><div class="bubble"></div>`;
  wrap.querySelector('.bubble').textContent=text;
  messagesEl.appendChild(wrap); messagesEl.scrollTop=messagesEl.scrollHeight;
  return wrap.querySelector('.bubble');
}

async function openConversation(id){
  activeConversationId=id; closeSidebar();
  const r=await api(`/api/conversations/${id}/messages`); const j=await r.json();
  $('title').textContent=j.conversation.title; messagesEl.innerHTML='';
  j.messages.forEach(m=>appendMessage(m.role,m.content));
  await loadConversations(false);
}

async function newConversation(){
  setStatus('创建中…');
  try{
    const r=await api('/api/conversations',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'}); const j=await r.json();
    activeConversationId=j.conversation.id; await loadConversations(false); await openConversation(activeConversationId); inputEl.focus();
  }catch(e){alert(e.message);} finally{setStatus('');}
}

function parseSSEBlock(block){
  let event='message',data='';
  block.split('\n').forEach(line=>{if(line.startsWith('event:'))event=line.slice(6).trim();if(line.startsWith('data:'))data+=line.slice(5).trim();});
  if(!data)return null; try{return {event,data:JSON.parse(data)}}catch{return null;}
}

async function sendMessage(){
  const text=inputEl.value.trim(); if(!text||sending)return;
  if(!activeConversationId) await newConversation();
  sending=true; $('sendBtn').disabled=true; $('micBtn').disabled=true; inputEl.value=''; resizeInput();
  appendMessage('user',text); const assistantBubble=appendMessage('assistant',''); setStatus('生成中…');
  try{
    const r=await api(`/api/conversations/${activeConversationId}/chat`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});
    const reader=r.body.getReader(); const decoder=new TextDecoder(); let buffer='';
    while(true){
      const {value,done}=await reader.read(); if(done)break; buffer+=decoder.decode(value,{stream:true});
      const blocks=buffer.split('\n\n'); buffer=blocks.pop();
      for(const block of blocks){
        const msg=parseSSEBlock(block); if(!msg)continue;
        if(msg.event==='delta'){assistantBubble.textContent+=msg.data.text||'';messagesEl.scrollTop=messagesEl.scrollHeight;}
        if(msg.event==='error'){throw new Error(msg.data.message||'生成失败');}
      }
    }
    await loadConversations(false);
  }catch(e){assistantBubble.textContent+=(assistantBubble.textContent?'\n\n':'')+'[错误] '+e.message;}
  finally{sending=false;$('sendBtn').disabled=false;$('micBtn').disabled=false;setStatus('');}
}

function preferredMime(){
  const options=['audio/webm;codecs=opus','audio/webm','audio/mp4'];
  return options.find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t))||'';
}

async function toggleMic(){
  if(recorder && recorder.state==='recording'){ recorder.stop(); return; }
  if(!window.isSecureContext || !navigator.mediaDevices?.getUserMedia){
    $('micHint').textContent='手机麦克风需要 HTTPS。推荐用 Tailscale Serve 打开此页面。'; return;
  }
  try{
    micStream=await navigator.mediaDevices.getUserMedia({audio:true}); chunks=[];
    const mime=preferredMime(); recorder=mime?new MediaRecorder(micStream,{mimeType:mime}):new MediaRecorder(micStream);
    recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
    recorder.onstop=async()=>{
      $('micBtn').classList.remove('recording'); $('micBtn').textContent='🎙'; setStatus('识别语音…');
      const type=recorder.mimeType||mime||'audio/webm'; const ext=type.includes('mp4')?'m4a':'webm';
      const blob=new Blob(chunks,{type}); const form=new FormData(); form.append('audio',blob,`recording.${ext}`);
      micStream?.getTracks().forEach(t=>t.stop());
      try{const r=await api('/api/transcribe',{method:'POST',body:form});const j=await r.json();inputEl.value=(inputEl.value?inputEl.value+' ':'')+(j.text||'');resizeInput();inputEl.focus();}
      catch(e){$('micHint').textContent='语音识别失败：'+e.message;}
      finally{setStatus('');}
    };
    recorder.start(); $('micBtn').classList.add('recording'); $('micBtn').textContent='■'; $('micHint').textContent='正在录音，点方块停止';
  }catch(e){$('micHint').textContent='无法访问麦克风：'+e.message;}
}

function resizeInput(){inputEl.style.height='auto';inputEl.style.height=Math.min(inputEl.scrollHeight,180)+'px';}
function closeSidebar(){$('sidebar').classList.remove('open');}

$('sendBtn').onclick=sendMessage; $('newChat').onclick=newConversation; $('micBtn').onclick=toggleMic;
$('menuBtn').onclick=()=>$('sidebar').classList.toggle('open');
inputEl.addEventListener('input',resizeInput);
inputEl.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();}});
$('tokenBtn').onclick=async()=>{token=$('tokenInput').value.trim();localStorage.setItem('remotify_token',token);if(await checkHealth()){await loadConversations(true);}};

(async()=>{if(await checkHealth()){await loadConversations(true);if(!activeConversationId)renderEmpty();if(!window.isSecureContext)$('micHint').textContent='当前不是 HTTPS，手机麦克风按钮可能不可用。';}})();
</script>
</body>
</html>
